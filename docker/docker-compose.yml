services:
  mysql:
    image: mysql:8.4
    container_name: bvom-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bvom_user", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bvom-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGIN: "http://localhost:5173"
      # CORS_ORIGIN: "http://localhost:5173,${TUNNEL_URL}"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_RECOVERY_KEY: ${ADMIN_RECOVERY_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      TEST_DB_HOST: mysql
      TEST_DB_PORT: 3306
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bvom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: "http://backend:8080"
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules

  # Free Cloudflare Quick Tunnel - no account or domain needed. Only starts
  # when requested (see scripts/start-app.sh / start-app.ps1). The public
  # URL is random and changes every time this container restarts.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bvom-cloudflared
    restart: unless-stopped
    command: tunnel --url http://frontend:5173
    depends_on:
      - frontend
    profiles: ["tunnel"]

  # Named tunnel for a Cloudflare account that owns a real domain. Requires
  # a tunnel token from the Cloudflare dashboard (CLOUDFLARE_TUNNEL_TOKEN in
  # docker/.env). Run with: docker compose --profile tunnel-named up
  cloudflared-named:
    image: cloudflare/cloudflared:latest
    container_name: bvom-cloudflared-named
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    profiles: ["tunnel-named"]

volumes:
  mysql_data:
  backend_uploads:
