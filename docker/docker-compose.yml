services:
  mysql:
    image: mysql:8.4
    container_name: bvom-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bvom
      MYSQL_USER: bvom_user
      MYSQL_PASSWORD: bvom_pass
      MYSQL_ROOT_PASSWORD: root_pass_change_me
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bvom_user", "-pbvom_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bvom-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bvom
      DB_USER: bvom_user
      DB_PASSWORD: bvom_pass
      CORS_ORIGIN: "http://localhost:5173"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change_me_now
      SESSION_SECRET: replace_with_a_long_random_secret
      TEST_DB_HOST: mysql
      TEST_DB_PORT: 3306
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bvom-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: "http://localhost:8080"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
  backend_uploads:
