<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recover Admin Password</title>
  <link rel="stylesheet" href="/src/styles/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-eyebrow">Admin Portal</div>
      <div class="login-title">Recover password</div>

      <form id="recover-password-form">
        <div class="form-group">
          <label for="recovery-key">Recovery Key</label>
          <input id="recovery-key" type="password" required>
        </div>

        <div class="form-group">
          <label for="new-password">New Password</label>
          <input id="new-password" type="password" required minlength="8">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <input id="confirm-password" type="password" required minlength="8">
        </div>

        <button type="submit" class="login-btn">Reset Password</button>
        <p id="error-message"></p>
      </form>

      <a href="/src/admin/admin.html" class="back-link">← Back to login</a>
    </div>
  </div>

  <script type="module" src="/src/js/admin/recover-password.js"></script>
</body>
</html>
