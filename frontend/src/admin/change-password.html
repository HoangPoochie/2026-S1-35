<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Admin Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-eyebrow">Admin Portal</div>
      <div class="login-title">Change password</div>

      <form id="change-password-form">
        <div class="form-group">
          <label for="current-password">Current Password</label>
          <input id="current-password" name="current-password" type="password" placeholder="Current password" autocomplete="current-password" required>
        </div>

        <div class="form-group">
          <label for="new-password">New Password</label>
          <input id="new-password" name="new-password" type="password" placeholder="New password" autocomplete="new-password" required minlength="8">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm New Password</label>
          <input id="confirm-password" name="confirm-password" type="password" placeholder="Confirm new password" autocomplete="new-password" required minlength="8">
        </div>

        <button type="submit" class="login-btn">Update Password</button>
        <p id="error-message"></p>
      </form>

      <a href="/src/admin/dashboard.html" class="back-link">← Back to dashboard</a>
    </div>
  </div>

  <script type="module" src="/src/js/admin/change-password.js"></script>
</body>
</html>
